<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown to November 1st</title>
<meta name="description" content="Live countdown to the start of November 1st, 2026.">
<meta property="og:title" content="Countdown to November 1st"><meta property="og:description" content="Live countdown to the start of November 1st, 2026.">
<meta property="og:url" content="https://krepchin.github.io/countdown/"><meta property="og:type" content="website"><meta property="og:image" content="https://krepchin.github.io/countdown/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://krepchin.github.io/countdown/og.png">
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e111c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center}
h1{font-size:clamp(1.5rem,5vw,3rem);margin:0 1rem 2rem;color:#c8d4f0}#c{display:flex;gap:clamp(.5rem,3vw,2rem);flex-wrap:wrap;justify-content:center}
.b{background:#1a2033;border-radius:16px;padding:1rem;min-width:clamp(70px,18vw,160px)}.n{font-size:clamp(2.5rem,10vw,6rem);font-weight:700;font-variant-numeric:tabular-nums}.l{color:#ffbe50;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(.7rem,2vw,1rem)}
#u{font-size:clamp(2.5rem,10vw,6rem);font-weight:700;color:#ffbe50;display:none}</style></head><body>
<h1>Countdown to November 1st</h1><div id="c"><div class="b"><div class="n" id="d">0</div><div class="l">Days</div></div><div class="b"><div class="n" id="h">00</div><div class="l">Hours</div></div><div class="b"><div class="n" id="m">00</div><div class="l">Minutes</div></div><div class="b"><div class="n" id="s">00</div><div class="l">Seconds</div></div></div><div id="u">Time's up!</div>
<script>var T=Date.UTC(2026,10,1,6,0,0);function p(x){return(x<10?'0':'')+x}
function t(){var r=Math.floor((T-Date.now())/1000);if(r<=0){document.getElementById('c').style.display='none';document.getElementById('u').style.display='block';return}
document.getElementById('d').textContent=Math.floor(r/86400);document.getElementById('h').textContent=p(Math.floor(r%86400/3600));document.getElementById('m').textContent=p(Math.floor(r%3600/60));document.getElementById('s').textContent=p(r%60)}
t();setInterval(t,1000);</script></body></html>
